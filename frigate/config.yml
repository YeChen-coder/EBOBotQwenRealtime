mqtt:
  enabled: true
  host: mosquitto
  port: 1883

# Portable CPU decode/detection. EBO Engine supplies its existing RTSP stream.
ffmpeg:
  path: "7.0"

detectors:
  openvino:
    type: openvino
    device: CPU

# YOLOv9-s 320（Frigate 官方推荐的 OpenVINO 模型）。原自带的 SSDLite MobileNet v2
# 在机器人贴地仰拍的画面上漏检半身的人、还会把搭着衣服的椅子认成人。
# 模型文件由 frigate/models/README.md 里的命令导出
model:
  model_type: yolo-generic
  width: 320
  height: 320
  input_tensor: nchw
  input_dtype: float
  path: /models/yolov9-s-320.onnx
  labelmap_path: /labelmap/coco-80.txt

# 人脸识别：先“囤”机器人贴地视角拍到的脸（Frigate 页面“人脸库 → 训练”里），
# 家人筛过、归到“妈妈/爸爸”后，识别才会认得这个仰拍角度。
# 手机拍的正脸照和贴地仰拍差太多，只靠它们实测认不出人。
face_recognition:
  enabled: true
  model_size: small
  # 640x360 画面里脸很小（实测 60~90 像素见方），默认 750 平方像素会漏掉站远一点的人
  min_area: 400
  # 训练区最多留多少张，留够筛选的量
  save_attempts: 500
  recognition_threshold: 0.9

objects:
  track:
    - person
  filters:
    person:
      # 默认 0.7：沙发上趴着/坐着/只露半身的人常常到不了（YOLOv9 误认少，可以放宽）
      threshold: 0.6
      # 640x360 画面里太小的“人”（窗外剪影等）不算；走廊远处真人约 4400 像素
      min_area: 2500

record:
  enabled: false
snapshots:
  enabled: false

cameras:
  ebo:
    enabled: true
    ffmpeg:
      inputs:
        - path: "{FRIGATE_EBO_RTSP_URL}"
          # Only subscribe to video. The assistant consumes Opus separately;
          # unused audio timestamps must not disrupt Frigate's video decoder.
          input_args:
            - -rtsp_transport
            - tcp
            - -timeout
            - "10000000"
            - -use_wallclock_as_timestamps
            - "1"
            - -allowed_media_types
            - video
            - -fflags
            - +genpts+discardcorrupt
          roles: [detect]
    detect:
      enabled: true
      # 机器人摄像头原始画面就是 640x360，放大到 1280x720 只会白耗 CPU
      width: 640
      height: 360
      fps: 5
version: 0.18-0
